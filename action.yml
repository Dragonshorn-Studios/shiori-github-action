name: Shiori
description: Export a selected AFFiNE knowledge subtree to deterministic Markdown.
author: Dragonshorn Studios
branding:
  icon: book-open
  color: purple
inputs:
  affine-base-url:
    description: Base URL of the AFFiNE instance.
    required: true
  affine-token:
    description: AFFiNE API token. Pass this from GitHub Secrets.
    required: true
  workspace-id:
    description: AFFiNE workspace UUID.
    required: true
  root-document-id:
    description: Document at the root of the export boundary.
    required: true
  output-directory:
    description: Repository-relative output directory.
    default: docs/brain
  agent-file:
    description: Repository-relative AGENTS.md adapter path, or empty to disable.
    default: AGENTS.md
  pages:
    description: Generate the lightweight GitHub Pages shell beside the brain.
    default: "true"
  max-documents:
    description: Safety cap for documents reached from the configured root.
    default: "250"
  affine-cli:
    description: Absolute path or PATH command name for an existing affine-cli; automatic installation is used when absent and install-affine-cli is true.
    default: affine
  install-affine-cli:
    description: Install the tested affine-cli revision with Go when it is absent.
    default: "true"
  skill-tag:
    description: AFFiNE tag that marks exported documents for Agent Skill generation. Empty disables skills.
    default: skill
  skills-directory:
    description: Repository-relative canonical Agent Skills directory.
    default: .agents/skills
  plugin-directory:
    description: Repository-relative directory for installable generated plugins.
    default: plugins
  marketplace-name:
    description: Name used by generated Claude Code, ZCode-compatible, and Cursor marketplace catalogs.
    default: shiori-knowledge
  repository:
    description: GitHub owner/repository used by Devin install metadata; defaults to GITHUB_REPOSITORY.
    required: false
outputs:
  document-count:
    description: Number of AFFiNE documents exported.
  skill-count:
    description: Number of tagged documents generated as Agent Skills.
runs:
  using: node20
  main: src/main.js
